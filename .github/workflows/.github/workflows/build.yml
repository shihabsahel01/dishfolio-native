name: Build Native Dishfolio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate missing Android native files and build APK
        run: |
          flutter create --platforms=android --org com.shihab --project-name dishfolio .
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Dishfolio-Native-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
